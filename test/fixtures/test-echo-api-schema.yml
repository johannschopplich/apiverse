openapi: 3.0.0
info:
  title: Test Echo API
  description: A small API covering the shapes the generated types have to carry
  version: 1.0.0

paths:
  /echo/{id}:
    get:
      summary: Echo a path parameter back
      operationId: echoById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: value
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful echo of the path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /echo/request:
    post:
      summary: Echo the request details back
      operationId: echoRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchoRequest'
      responses:
        '200':
          description: Successful echo of the request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    StaticResponse:
      type: object
      required:
        - value
      properties:
        value:
          type: string

    EchoRequest:
      type: object
      additionalProperties: true

    EchoResponse:
      type: object
      required:
        - path
        - method
      properties:
        path:
          type: string
        body:
          type: object
          additionalProperties: true
          nullable: true
        method:
          type: string
          enum: [GET, POST]

    Error:
      type: object
      required:
        - statusCode
        - statusMessage
      properties:
        statusCode:
          type: integer
        statusMessage:
          type: string

  responses:
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: The request was malformed or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
